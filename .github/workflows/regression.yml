name: Regression
on: [push, pull_request]
env:
  CORE_DEPS: "'PyMuPDF>=1.26' 'opencv-python-headless>=4.10' 'scikit-image>=0.26' 'numpy>=2.0' 'shapely>=2.1' 'networkx>=3.0' 'jsonschema>=4.23' 'flask>=3.0'"
jobs:
  # Core dependencies only: the parser must keep working with no add-in installed.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ${{ env.CORE_DEPS }}
      - run: python -m unittest discover -s tests -v

  # Same suite plus the bundled add-ins' dependencies, so the tests the core
  # job skips are actually run somewhere.
  addin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ${{ env.CORE_DEPS }} 'ezdxf>=1.4'
      - run: python -m unittest discover -s tests -v
